<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusQuest - Plan • Focus • Level Up</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a855f7'><polygon points='12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2'/></svg>">
</head>
<body>
  <!-- Canvas Confetti Overlay -->
  <canvas id="confetti-canvas" style="position: fixed; inset: 0; pointer-events: none; z-index: 999;"></canvas>

  <!-- Toast Alerts Container -->
  <div id="toast-container" class="toast-container"></div>

  <div class="app-container">
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff">
            <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>FocusQuest</h1>
          <p>Plan • Focus • Level Up</p>
        </div>
      </div>

      <nav class="nav-menu">
        <a class="nav-item active" data-view="home" onclick="setView('home')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </a>
        <a class="nav-item" data-view="tasks" onclick="setView('tasks')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Tasks
        </a>
        <a class="nav-item" data-view="pomodoro" onclick="setView('pomodoro')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Pomodoro
        </a>
        <a class="nav-item" data-view="achievements" onclick="setView('achievements')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
          Achievements
        </a>
        <a class="nav-item" data-view="leaderboard" onclick="setView('leaderboard')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Leaderboard
        </a>
        <a class="nav-item" data-view="profile" onclick="setView('profile')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Profile
        </a>
        <a class="nav-item" data-view="settings" onclick="setView('settings')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
      </nav>

      <!-- SIDEBAR BOTTOM BANNER (Matching Screenshot) -->
      <div class="sidebar-bottom-banner">
        <svg width="100%" height="90" viewBox="0 0 180 90">
          <defs>
            <linearGradient id="mountGrad" x1="0" y1="0" x2="0" y2="90" gradientUnits="userSpaceOnUse">
              <stop stop-color="#4c1d95"/>
              <stop offset="1" stop-color="#1e1035"/>
            </linearGradient>
            <linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#e9d5ff"/>
              <stop offset="1" stop-color="#c084fc"/>
            </linearGradient>
          </defs>
          <!-- Stars -->
          <circle cx="25" cy="18" r="1.5" fill="#fff" opacity="0.6"/>
          <circle cx="150" cy="22" r="1.2" fill="#fff" opacity="0.8"/>
          <circle cx="85" cy="12" r="1.5" fill="#c084fc" opacity="0.9"/>
          <text x="135" y="16" font-size="10" fill="#fef08a">✨</text>

          <!-- Back mountain -->
          <polygon points="40,85 105,35 170,85" fill="#2e1065" />
          <!-- Main mountain -->
          <polygon points="10,90 90,24 165,90" fill="url(#mountGrad)" />
          <!-- Snow cap -->
          <polygon points="90,24 74,42 82,38 90,44 98,39 106,42" fill="url(#snowGrad)" />
          <!-- Summit Flag pole -->
          <line x1="90" y1="24" x2="90" y2="12" stroke="#fbbf24" stroke-width="1.8" />
          <!-- Summit Flag -->
          <polygon points="90,12 105,16 90,20" fill="#f97316" />
        </svg>
        <p>Dream Bigger.</p>
        <span>Be Productive.</span>
      </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <main class="main-wrapper">
      <!-- TOP HEADER -->
      <header class="top-header">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#655e8c" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Search tasks...">
        </div>

        <div class="top-actions">
          <button class="notif-btn" title="Notifications" onclick="showToast('You completed 6 tasks today! Keep shining ✨', 'info')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-badge">1</span>
          </button>

          <button class="user-profile-btn" onclick="setView('profile')">
            <div class="avatar-wrapper" id="header-avatar">
              <!-- Avatar initials rendered here -->
            </div>
          </button>
        </div>
      </header>

      <!-- VIEW BODY (Dynamically rendered) -->
      <section class="content-body" id="view-content">
        <!-- Rendered by app.js -->
      </section>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
